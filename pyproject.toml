[project]
name = "norway-company-agent-poc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.14,<5",
  "extruct>=0.18,<1",
  "lxml>=6,<7",
  "pydantic>=2.12,<3",
  "pypdf>=6,<7",
  "tldextract>=5.3,<6",
  "trafilatura>=2.0,<3",
]

[project.optional-dependencies]
crawler = [
  "scrapy>=2.13,<3",
  "scrapy-playwright>=0.0.44,<1",
]
sentiment = [
  "accelerate>=1.10,<2",
  "torch>=2.5,<3",
  "transformers>=4.51,<5",
]

[tool.uv]
package = false
